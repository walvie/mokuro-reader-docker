server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Reverse-proxy to the optional library-server sidecar (see
  # docker-compose.yml). Resolved at request time via Docker's embedded DNS
  # (127.0.0.11) rather than once at nginx startup, so this container keeps
  # working (returning 502 for /api/*) even if library-server isn't running
  # — e.g. a compose override that drops the service entirely.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # ^~ so this wins over the image-extension regex location below: without
  # it, a request like /api/volumes/<uuid>/pages/0001.webp would match both,
  # and nginx prefers a regex location over a plain prefix one.
  location ^~ /api/ {
    set $library_upstream library-server:3300;
    proxy_pass http://$library_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Manga page images can be large; give slow reads room before nginx gives up.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # More specific than /api/ above — nginx picks the longest matching ^~
  # prefix, so this wins for anything under /api/mokuro/ regardless of
  # declaration order. Routes to the mokuro-worker sidecar (job queue for
  # running OCR processing) instead of library-server.
  location ^~ /api/mokuro/ {
    set $mokuro_worker_upstream mokuro-worker:8100;
    proxy_pass http://$mokuro_worker_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Enqueueing/listing jobs is fast, but this keeps the same generous
    # timeout as /api/ for consistency and any long-polling clients.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # Vite chunk/asset filenames are content-hashed, so they can be cached
  # forever. Everything else (index.html, the service worker, manifest,
  # SvelteKit's small env/version files) must revalidate on every request
  # so deploys and self-hosted config changes are picked up immediately.
  location /_app/immutable/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location = /service-worker.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location ~* \.(?:png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    # Hash-based client-side router: always fall back to index.html.
    try_files $uri /index.html;
  }
}
