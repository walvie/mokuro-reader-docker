server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Vite chunk/asset filenames are content-hashed, so they can be cached
  # forever. Everything else (index.html, the service worker, manifest,
  # SvelteKit's small env/version files) must revalidate on every request
  # so deploys and self-hosted config changes are picked up immediately.
  location /_app/immutable/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location = /service-worker.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location ~* \.(?:png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    # Hash-based client-side router: always fall back to index.html.
    try_files $uri /index.html;
  }
}
