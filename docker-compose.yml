services:
  mokuro-reader:
    build:
      context: .
      dockerfile: Dockerfile
    image: mokuro-reader:latest
    container_name: mokuro-reader
    restart: unless-stopped
    ports:
      - '${PORT:-8080}:80'
    environment:
      # Optional cloud-sync credentials. All are public OAuth client
      # identifiers (not secrets) that the browser needs to talk to each
      # provider directly; leave unset to hide that provider. See README.md
      # for how to obtain them. Applied at container start, no rebuild
      # needed when you change them.
      VITE_GDRIVE_CLIENT_ID: ${VITE_GDRIVE_CLIENT_ID:-}
      VITE_GDRIVE_API_KEY: ${VITE_GDRIVE_API_KEY:-}
      VITE_ONEDRIVE_CLIENT_ID: ${VITE_ONEDRIVE_CLIENT_ID:-}
    depends_on:
      - library-server
      - mokuro-worker

  # Optional read-only server-side manga library: serves volumes directly
  # from a mounted host directory over HTTP instead of importing them into
  # each browser's storage. See README.md ("Self-hosted server library").
  # Point MANGA_LIBRARY_PATH in .env at your manga folder; leave it unset
  # and the library is simply empty (the mokuro-reader service still works
  # normally via manual upload).
  library-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: mokuro-reader-library-server:latest
    container_name: mokuro-reader-library-server
    restart: unless-stopped
    environment:
      LIBRARY_RESCAN_INTERVAL_MINUTES: ${LIBRARY_RESCAN_INTERVAL_MINUTES:-0}
    volumes:
      - ${MANGA_LIBRARY_PATH:-./library}:/library:ro

  # Runs mokuro (OCR) against volumes in the server library that don't have
  # it yet — see README.md ("Mokuro processing"). Unlike library-server, this
  # mounts the library READ-WRITE (it has to: mokuro writes .mokuro files and
  # an _ocr cache alongside your images) and is CPU-only by default. First
  # build is slow (installs PyTorch + the OCR model's dependencies); first
  # use downloads the OCR model itself, cached in the mokuro_model_cache
  # volume so it isn't re-downloaded on every restart.
  mokuro-worker:
    build:
      context: ./mokuro-worker
      dockerfile: Dockerfile
    image: mokuro-reader-mokuro-worker:latest
    container_name: mokuro-reader-mokuro-worker
    restart: unless-stopped
    environment:
      LIBRARY_SERVER_URL: http://library-server:3300
    volumes:
      - ${MANGA_LIBRARY_PATH:-./library}:/library
      - mokuro_model_cache:/root/.cache/huggingface
    depends_on:
      - library-server

volumes:
  mokuro_model_cache:
